name: Release

# Pushing a tag like v3.0.0-beta.3 builds the installer, sends it to SignPath, waits for
# a person to approve the signing there, and leaves a draft release to publish by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  release:
    # Stays off until SignPath is set up, see RELEASING.md.
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: windows-latest
    # No build cache: SignPath must be able to trust that this binary came from this source.
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content app/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match version $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

      - run: cargo install tauri-cli --version 2.12.4 --locked
      - run: cargo tauri build

      - name: Give the installer a fixed name
        shell: pwsh
        run: |
          New-Item -ItemType Directory unsigned | Out-Null
          Get-ChildItem "target/release/bundle/nsis/*-setup.exe" | Move-Item -Destination unsigned/OrganizeForMe-setup.exe

      - name: Upload the unsigned installer
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: unsigned/OrganizeForMe-setup.exe
          if-no-files-found: error

      - name: Ask SignPath to sign it
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Long enough for a person to see the request and approve it.
          wait-for-completion-timeout-in-seconds: 21600
          output-artifact-directory: signed
          parameters: |
            version: "${{ steps.version.outputs.version }}"

      - name: Check the signature is valid
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature signed/OrganizeForMe-setup.exe
          if ($signature.Status -ne 'Valid') { throw "Signature status: $($signature.Status)" }

      - name: Leave a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $flags = @('--draft', '--generate-notes', '--title', "Organize for Me $env:GITHUB_REF_NAME")
          if ($env:GITHUB_REF_NAME -match '-') { $flags += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME signed/OrganizeForMe-setup.exe @flags
